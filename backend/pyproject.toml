[project]
name = "decision-evidence"
version = "0.1.0"
description = "Kundenfeedback zu begründeten Produktentscheidungen"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "psycopg[binary,pool]",
  "httpx",
  "pyjwt[crypto]",
  "cryptography",
  "celery",
  "boto3",
  "anthropic",
  "pypdf",
  "python-multipart",
  "orjson",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-timeout",
  "ruff",
  "mypy",
  "types-boto3",
  "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_evidence"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "../tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "S608", "B008", "RUF012", "E501"]

[tool.ruff.lint.per-file-ignores]
"../tests/**" = ["S105", "S106", "S311", "S324", "E402", "S608"]
"tests/**" = ["S105", "S106", "S311", "S324", "E402", "S608"]

[tool.pytest.ini_options]
testpaths = ["../tests/unit", "../tests/integration"]
pythonpath = ["src", "../tests"]
timeout = 120
markers = [
  "integration: needs a real PostgreSQL (see scripts/test_integration.sh)",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
