# Optional overlay: runs Ollama as an additional container and points API and worker at it.
#   AI_PROVIDER=ollama OLLAMA_MODEL=<model> docker compose -f compose.yaml -f compose.ollama.yaml up -d
#   docker compose -f compose.yaml -f compose.ollama.yaml exec ollama ollama pull <model>       (once; needs internet access)
# Production: add it after compose.prod.yaml and keep --env-file .env.prod. Ollama is only reachable on the internal network.
# The official image runs as root and is CPU only here. For an NVIDIA GPU install the NVIDIA container toolkit and
# add to the ollama service:  deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
services:
  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 10s
  api:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
  worker:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
