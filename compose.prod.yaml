# decision-evidence: single-server PRODUCTION configuration (no automatic deployment).
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
# Differences to the demo stack (compose.yaml): every secret is mandatory (no defaults), APP_ENV=production (the
# application refuses demo values and the demo AI adapter at start-up), no demo seed, Keycloak runs in production mode
# ("start", not "start-dev") with the production realm (no users, no known passwords), the gateway terminates HTTPS.
# See docs/operations/production.md. Operational readiness is not high availability and not legal compliance.
name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

x-backend: &backend
  build:
    context: ./backend
    secrets: [extra_ca]
  image: decision-evidence-backend:${DE_VERSION:?set DE_VERSION (release tag)}
  restart: unless-stopped
  init: true

x-public: &public
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN (https://your.host)}

x-oidc: &oidc
  OIDC_ISSUER: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN (https://your.host)}/auth/realms/decision-evidence
  OIDC_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/decision-evidence
  OIDC_CLIENT_ID: decision-evidence-web

x-db: &db
  DB_HOST: postgres
  DB_NAME: decision_evidence

x-s3: &s3
  S3_ENDPOINT_URL: http://storage:8333
  S3_BUCKET: decision-evidence
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (see .env.example)}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (see .env.example)}

x-ai: &ai
  AI_PROVIDER: ${AI_PROVIDER:?set AI_PROVIDER=anthropic}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
  MOCK_AI_DELAY_SECONDS: "0"

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: roles and databases (idempotent, never drops anything). Runs as the only superuser consumer.
  db-init:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: "no"
    entrypoint: ["sh", "/scripts/db-init.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      DB_NAME: decision_evidence
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD (see .env.example)}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?set DB_AUTH_PASSWORD (see .env.example)}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD (see .env.example)}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?set DB_WORKER_PASSWORD (see .env.example)}
      DB_OUTBOX_PASSWORD: ${DB_OUTBOX_PASSWORD:?set DB_OUTBOX_PASSWORD (see .env.example)}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD (see .env.example)}
    volumes:
      - ./infra/postgres/db-init.sh:/scripts/db-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: Alembic migrations, never run by API processes. Uses the migrator role (table owner).
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: [*db, *public]
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD (see .env.example)}
    depends_on:
      db-init:
        condition: service_completed_successfully

  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (see .env.example)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (see .env.example)}
    volumes:
      - seaweed-data:/data
      - ./infra/storage/entrypoint.sh:/scripts/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9333/cluster/status >/dev/null && nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.6-alpine@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: decision
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD (see .env.example)}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  keycloak:
    image: keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD (see .env.example)}
      KC_HOSTNAME: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN (https://your.host)}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD (see .env.example)}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET (see .env.example)}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN (https://your.host)}
    volumes:
      - ./infra/keycloak/realm-prod.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      db-init:
        condition: service_completed_successfully

  # One-shot: bucket + demo seed (APP_ENV=demo/test only). Production never seeds.
  bootstrap:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "decision_evidence.tools.bootstrap"]
    environment:
      <<: [*db, *public, *oidc, *s3, *ai]
      APP_ENV: production
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD (see .env.example)}
      DEMO_SEED: "false"
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: [*db, *public, *oidc, *s3, *ai]
      APP_ENV: production
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?set DB_AUTH_PASSWORD (see .env.example)}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD (see .env.example)}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET (see .env.example)}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (see .env.example)}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 15s
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["celery", "-A", "decision_evidence.jobs.worker", "worker", "-B", "--loglevel=INFO", "--concurrency=2", "--schedule=/tmp/celerybeat-schedule", "--without-heartbeat", "--without-gossip", "--without-mingle"]
    environment:
      <<: [*db, *public, *s3, *ai]
      APP_ENV: production
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?set DB_WORKER_PASSWORD (see .env.example)}
      RABBITMQ_URL: amqp://decision:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD (see .env.example)}@rabbitmq:5672/
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-15}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,sys; d=json.load(open('/tmp/worker-alive')); sys.exit(0 if time.time()-d['ts']<120 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 45s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  outbox-publisher:
    <<: *backend
    command: ["python", "-m", "decision_evidence.jobs.publisher"]
    environment:
      <<: [*db, *public]
      APP_ENV: production
      DB_OUTBOX_PASSWORD: ${DB_OUTBOX_PASSWORD:?set DB_OUTBOX_PASSWORD (see .env.example)}
      RABBITMQ_URL: amqp://decision:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD (see .env.example)}@rabbitmq:5672/
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,sys; d=json.load(open('/tmp/publisher-alive')); sys.exit(0 if time.time()-d['ts']<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      secrets: [extra_ca]
    image: decision-evidence-frontend:${DE_VERSION:?set DE_VERSION (release tag)}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  gateway:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    environment:
      SITE_ADDRESS: ${PUBLIC_HOST:?set PUBLIC_HOST (the DNS name of this server)}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-auto}
    volumes:
      - ./infra/gateway:/etc/caddy:ro
      - caddy-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
  seaweed-data:
  rabbitmq-data:
  caddy-data:

secrets:
  # optional CA bundle for builds behind TLS-inspecting proxies (empty by default)
  extra_ca:
    file: ${EXTRA_CA_BUNDLE:-/dev/null}
